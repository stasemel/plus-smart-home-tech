spring:
  application:
    name: shopping-store
  config:
    import: "configserver:"
  cloud:
    config:
      fail-fast: true
      retry:
        useRandomPolicy: true
        max-interval: 6000
  discovery:
    enable: true
    service-id: config-server

eureka:
  client:
    serviceUrl:
      defaultZone: http://${eureka.instance.hostname}:${eurika.instance.port}/eureka/
