grpc:
  client:
    hub-router:
      address: static://localhost:59090
      enable-keep-alive: true
      keep-alive-without-calls: true
      negotiation-type: plaintext

spring:
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: always
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/analyzer
    username: dbuser
    password: "12345"

kafka:
  analyzer:
    bootstrap-servers: localhost:9092
    hubs-event-topic: telemetry.hubs.v1
    snapshots-topic: telemetry.snapshots.v1
    hub-consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: ru.yandex.practicum.kafka.telemetry.serializer.HubEventAvroDeserializer
      group-id: analyzer
      client-id: hub-consumer1
      properties:
        fetch-min-bytes: 100
        enable-auto-commit: false
        fetch-max-wait-ms: 10000
        max-partition-fetch-bytes: 1000000
        max-poll-records: 10
    snapshot-consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: ru.yandex.practicum.kafka.telemetry.serializer.SensorsSnapshotAvroDeserializer
      group-id: analyzer
      client-id: snapshot-consumer1
      properties:
        fetch-min-bytes: 100
        enable-auto-commit: false
        fetch-max-wait-ms: 10000
        max-partition-fetch-bytes: 1000000
        max-poll-records: 10